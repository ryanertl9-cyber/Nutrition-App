<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- The app lives at /app/; its scripts and data live at the site root. -->
<base href="/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Simply Nutrition">
<style>
/* Hosted app only (the claude.ai viewer reserves this space itself): when installed on a phone the page runs
   under the status bar (clock, battery), so start the content below it. */
body { padding-top: var(--safe-top); }
</style>
<!-- ARTIFACT-START -->
<title>Simply Nutrition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500..800&family=Inter:wght@400..700&display=swap">
<style>
/* Layout: sticky app bar + tabs; Today is a two-column desk (scoreboard right, logging left) that stacks with the scoreboard first on phones. */
:root {
  /* Dark, single theme to match the landing page: black, white type and pills, a hint of purple.
     Status colours: green met, amber close, orange low, pink over (purple is decoration only). */
  --bg: #000000; --surface: #0d0d0f; --sunken: #17171a; --ink: #f5f5f7; --muted: #8e8e93; --white: #f5f5f7;
  --line: rgb(255 255 255 / 9%); --line-strong: rgb(255 255 255 / 18%);
  --accent: #a78bfa; --accent-ink: #0c0618; --accent-soft: rgb(167 139 250 / 15%);
  --met: #34c77b; --near: #f5b742; --low: #ff6b3d; --over: #ff4d8d; --info: #6e6e73;
  --met-soft: rgb(52 199 123 / 16%); --near-soft: rgb(245 183 66 / 16%); --low-soft: rgb(255 107 61 / 16%); --over-soft: rgb(255 77 141 / 16%);
  --track: #26262b;
  --display: "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --radius: 18px; --shadow: 0 20px 60px rgb(0 0 0 / 50%);
  --safe-top: env(safe-area-inset-top, 0px); /* height of the phone's status bar area, 0 in a normal browser tab */
  color-scheme: dark;
}
html { background: var(--bg); }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-stretch: 85%; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 1.15rem; font-weight: 800; letter-spacing: .01em; }
h3 { font-size: .95rem; font-weight: 750; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font: 700 .72rem/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
[hidden] { display: none !important; }

/* App bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--safe-top); z-index: 30; background: var(--bg); }
.appbar { position: sticky; top: var(--safe-top); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px 0; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
/* Wordmark matches the landing page: Inter, medium weight, widely tracked capitals. */
.brand h1 { font: 600 .95rem/1 "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-stretch: normal; letter-spacing: .28em; text-transform: uppercase; }
@media (max-width: 480px) { .brand h1 { font-size: .82rem; letter-spacing: .2em; } }
.brand .mark { width: 18px; height: 18px; flex: none; }
.brand .mark rect { fill: var(--ink); }
.brand .mark rect.miss { fill: var(--low); }
.datenav { display: flex; align-items: center; gap: 4px; }
.datenav .label { min-width: 9.5em; text-align: center; font-weight: 650; }
.datenav .btn.icon { font-size: 1.3rem; line-height: 1; padding: 2px 10px 5px; }
.account-slot { display: flex; align-items: center; min-width: 0; }
.account-slot .btn { max-width: 15em; }
.acct-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
@media (max-width: 520px) { .acct-email { max-width: 7em; } }
.tabs { flex-basis: 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 10px 14px 11px; font-weight: 650; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab:hover { color: var(--ink); }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn.icon { padding: 6px 9px; min-width: 34px; }
.btn.small { padding: 4px 9px; font-size: .85rem; }
.btn.danger { color: var(--low); }
.btn:disabled { opacity: .5; cursor: default; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: .8rem; font-weight: 650; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-width: 0; }
textarea.input { resize: vertical; min-height: 64px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card + .card { margin-top: 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }

main { padding-block: 18px 64px; }
.banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; }
.banner p { margin: 0; }

/* Today layout */
.today { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }
.today .col-log { order: 1; }
.today .col-score { order: 2; position: sticky; top: calc(var(--safe-top) + 100px); }
@media (max-width: 900px) {
  .today { grid-template-columns: minmax(0, 1fr); }
  .today .col-score { order: 0; position: static; }
}

/* Scoreboard, styled after the heavy rules of a Nutrition Facts panel */
.score { border: 2px solid var(--ink); border-radius: 4px; padding: 12px 14px 14px; background: var(--surface); }
.score .rule-xl { height: 9px; background: var(--ink); margin: 8px -14px 8px; }
.score .rule { height: 1px; background: var(--ink); margin: 6px 0; opacity: .8; }
.score .rule-m { height: 4px; background: var(--ink); margin: 8px 0; }
.score-title { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.score-title h2 { font-size: 2rem; font-weight: 900; font-stretch: 70%; text-transform: none; letter-spacing: -.01em; line-height: 1; }
.bigcount { font-family: var(--display); font-stretch: 70%; font-weight: 900; font-size: 3.2rem; line-height: .9; font-variant-numeric: tabular-nums; }
.bigcount small { font-size: 1.4rem; font-weight: 700; color: var(--muted); }
.statebar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--track); margin: 10px 0 6px; }
.statebar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; }
.legend b { font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: .72em; height: .72em; border-radius: 50%; vertical-align: .02em; flex: none; box-sizing: border-box; }
.dot.s-met { background: currentColor; }
.dot.s-near { border: 2px solid currentColor; background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.dot.s-low { border: 2px solid currentColor; }
.dot.s-over { background: currentColor; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); width: .8em; }
.dot.s-info { background: currentColor; width: .35em; height: .35em; vertical-align: .15em; }
.sq { display: inline-block; width: .8em; height: .8em; border-radius: 2px; vertical-align: -.05em; }
.sq.none { background: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 4px); }
.s-met { color: var(--met); } .s-near { color: var(--near); } .s-low { color: var(--low); } .s-over { color: var(--over); } .s-info { color: var(--info); }
.bg-met { background: var(--met); } .bg-near { background: var(--near); } .bg-low { background: var(--low); } .bg-over { background: var(--over); }

.energy { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; }
.energy .kcal { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-size: 1.9rem; font-variant-numeric: tabular-nums; line-height: 1; }
.macros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.macro .v { font-weight: 700; font-variant-numeric: tabular-nums; }

/* Nutrient rows */
.attn { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: .84rem; font-weight: 600; border: 1px solid transparent; cursor: pointer; background: var(--sunken); }
.chip.low { background: var(--low-soft); color: var(--ink); border-color: color-mix(in srgb, var(--low) 35%, transparent); }
.chip.over { background: var(--over-soft); border-color: color-mix(in srgb, var(--over) 35%, transparent); }
.chip.near { background: var(--near-soft); border-color: color-mix(in srgb, var(--near) 35%, transparent); }
.chip:hover { border-color: var(--ink); }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; font-weight: 600; font-size: .85rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.cat { margin-top: 12px; }
.cat h3 { font-family: var(--body); font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.nrow { display: grid; grid-template-columns: 1em minmax(8em, 11em) minmax(60px, 1fr) 12.5em; gap: 8px; align-items: center; padding: 6px 2px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.nrow:hover { background: var(--sunken); }
.nrow .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nrow .amt { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); text-align: right; white-space: nowrap; }
.nrow .amt b { color: var(--ink); font-weight: 650; }
.bar { position: relative; height: 9px; background: var(--track); border-radius: 5px; overflow: visible; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; max-width: 100%; }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; opacity: .55; }
.incomplete { font-size: .7rem; color: var(--muted); }

/* Meals */
.quick textarea { min-height: 52px; }
.quick .hint { font-size: .82rem; color: var(--muted); }
.parsed { display: grid; gap: 6px; margin-top: 10px; }
.pitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); }
.pitem .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; grid-column: 1 / -1; }
.pitem .controls .input { width: auto; padding: 4px 8px; }
.pitem .qty { width: 5.5em !important; }
.pitem .foodsel { width: 100% !important; flex: 1 1 100%; order: -1; }
.pitem.nomatch { border-style: dashed; }
.meal { padding: 12px 0 4px; border-top: 1px solid var(--line); }
.meal:first-of-type { border-top: 0; padding-top: 0; }
.meal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.meal-head h3 { font-size: 1.05rem; font-weight: 800; }
.entries { list-style: none; margin: 6px 0 0; padding: 0; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 4px; border-radius: 6px; }
.entry:hover { background: var(--sunken); }
.entry .name { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; cursor: pointer; background: none; border: 0; text-align: left; padding: 0; }
.entry .portion { font-size: .8rem; color: var(--muted); }
.entry .kc { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
.empty { color: var(--muted); font-size: .9rem; padding: 6px 0; }

/* Sheet (dialog) */
.scrim { position: fixed; inset: 0; background: rgb(8 14 11 / 45%); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: min(720px, 100%); max-height: min(88vh, 860px); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 760px) { .scrim { align-items: center; } .sheet { border-radius: 14px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 10px; border-bottom: 1px solid var(--line); }
.sheet-body { overflow-y: auto; padding: 12px 16px 18px; min-height: 0; }
.results { list-style: none; margin: 8px 0 0; padding: 0; }
.result { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.result .pick { background: none; border: 0; text-align: left; padding: 0; cursor: pointer; min-width: 0; }
.result .pick b { display: block; font-weight: 600; line-height: 1.3; }
.result .meta { font-size: .78rem; color: var(--muted); }
.result .version { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; }
.result .versions { color: var(--accent); font-weight: 600; }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 4px; }
.kinds .eyebrow { margin-right: 4px; }
.result:hover { background: var(--sunken); }
.tag { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--sunken); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
.tag.mine { background: var(--accent-soft); color: var(--accent); }
.portion-pane { display: grid; gap: 12px; }
.preview-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.preview-grid .p { background: var(--sunken); border-radius: 8px; padding: 8px; }
.preview-grid .p b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.mini-bars { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 14px; }
.mini-bars .m { font-size: .8rem; display: grid; gap: 2px; }
.mini-bars .bar { height: 6px; }

/* Detail */
.detail-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.detail-top .big { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-size: 2.2rem; font-variant-numeric: tabular-nums; }
.list-plain { list-style: none; padding: 0; margin: 6px 0 0; }
.list-plain li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.list-plain li > span:first-child { min-width: 0; }

/* Trends */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .v { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.insights { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.insights li { display: grid; grid-template-columns: 1.3em minmax(0, 1fr); gap: 8px; align-items: start; }
.heat-wrap { overflow-x: auto; margin-top: 8px; }
.heat { border-collapse: separate; border-spacing: 2px; font-size: .78rem; }
.heat th { font-weight: 600; text-align: left; white-space: nowrap; padding-right: 8px; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.heat thead th { position: static; font-weight: 500; color: var(--muted); text-align: center; padding: 0; font-size: .68rem; }
.heat td { width: 18px; min-width: 18px; height: 18px; border-radius: 3px; padding: 0; }
.heat td.c-met { background: var(--met); } .heat td.c-near { background: var(--near); opacity: .85; } .heat td.c-low { background: var(--low); opacity: .9; } .heat td.c-over { background: var(--over); }
.heat td.c-none { background: repeating-linear-gradient(45deg, var(--sunken) 0 3px, transparent 3px 6px); }
.heat td button { width: 100%; height: 100%; border: 0; background: transparent; cursor: pointer; padding: 0; display: block; }
.heat tr.sep th, .heat tr.sep td { padding-top: 8px; }
.adherence { display: grid; gap: 4px; }
.adh { display: grid; grid-template-columns: minmax(8em, 11em) minmax(0, 1fr) 3.2em; gap: 10px; align-items: center; font-size: .88rem; }
.adh .bar { height: 10px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.trend-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .trend-grid { grid-template-columns: minmax(0, 1fr); } }

/* Settings + foods */
.settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .settings-grid { grid-template-columns: minmax(0, 1fr); } }
.table-wrap { overflow-x: auto; }
table.targets { border-collapse: collapse; width: 100%; font-size: .88rem; }
table.targets th, table.targets td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.targets td .input { width: 6.5em; padding: 4px 6px; }
table.targets .basis { font-size: .75rem; color: var(--muted); }
.food-list { list-style: none; padding: 0; margin: 0; }
.food-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; z-index: 60; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.foot { margin-top: 28px; font-size: .8rem; color: var(--muted); }
details summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .35s ease; } }
@media (max-width: 520px) {
  .nrow { grid-template-columns: 1em minmax(0, 1fr) auto; }
  .nrow .bar { grid-column: 2 / -1; grid-row: 2; }
  .preview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bigcount { font-size: 2.6rem; }
  .datenav .label { min-width: 7.5em; }
}

/* ---- Dark modern theme, matching the landing page ---- */
body { letter-spacing: -.005em; background: var(--bg) radial-gradient(1100px 420px at 85% -140px, rgb(167 139 250 / 18%), transparent 70%) no-repeat; }
h1, h2, h3 { font-family: var(--display); font-stretch: normal; letter-spacing: -.02em; }
h2 { font-weight: 700; }
h3 { font-weight: 650; }
.eyebrow { font: 600 .68rem/1.2 var(--body); letter-spacing: .2em; }
a { color: var(--accent); }
body::before { background: var(--bg); }
.appbar { background: #000000; border-bottom-color: var(--line); }
/* Phones: Sign in sits next to the logo, so the bar takes less of the screen. */
@media (max-width: 600px) {
  .appbar .wrap { padding-block: 8px 0; row-gap: 4px; }
  .brand { order: 0; }
  .account-slot { order: 1; }
  .datenav { order: 2; flex-basis: 100%; justify-content: space-between; }
  .tabs { order: 3; }
  .tab { padding: 11px 12px 10px; }
}
.tab { font: 600 .72rem/1 var(--body); letter-spacing: .16em; text-transform: uppercase; padding: 15px 14px 13px; border-bottom-width: 2px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.datenav .label { font-weight: 600; }
.btn { border-radius: 999px; background: rgb(255 255 255 / 6%); border-color: var(--line-strong); padding: 8px 16px; }
.btn:hover { background: rgb(255 255 255 / 12%); border-color: var(--line-strong); }
.btn.primary { background: var(--white); color: #000; border-color: var(--white); }
.btn.primary:hover { filter: none; background: #ffffff; }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.accent:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: rgb(255 255 255 / 8%); }
.btn.small { padding: 5px 12px; }
.btn.icon { padding: 6px 10px; }
.input, select.input, textarea.input { background: var(--sunken); border-color: var(--line); border-radius: 12px; }

.chip { background: var(--sunken); }

.result:hover, .entry:hover, .nrow:hover { background: rgb(255 255 255 / 5%); }
.pitem { background: var(--sunken); border-radius: 14px; }

.scrim { background: rgb(0 0 0 / 65%); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet { background: #0f0f11; border: 1px solid var(--line); border-radius: 22px 22px 0 0; }
@media (min-width: 760px) { .sheet { border-radius: 22px; } }
.preview-grid .p { border-radius: 14px; }
.toast { background: var(--white); color: #000; border-radius: 999px; }

/* The daily scoreboard is a white Nutrition Facts panel on black, like the label on the landing page. */
.score {
  --surface: #ffffff; --sunken: #f2f2f5; --ink: #111111; --muted: #5f5f66; --white: #111111;
  --line: #d9d9de; --line-strong: #c7c7cc; --track: #e8e8ed; --info: #8e8e93;
  --met: #1c8a4a; --near: #b7790a; --low: #d4461c; --over: #d1245f;
  --met-soft: #dcf1e4; --near-soft: #f8ecd2; --low-soft: #fbe2d8; --over-soft: #fbdde7;
  background: #ffffff; color: #111111; border: 2px solid #111111; border-radius: 6px; color-scheme: light;
  box-shadow: 0 0 0 1px rgb(255 255 255 / 6%), 0 30px 90px rgb(167 139 250 / 16%);
}
.score .score-title h2, .score .bigcount { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-stretch: normal; letter-spacing: -.02em; }
.score .seg button[aria-pressed="true"] { background: #111111; color: #ffffff; }
.score .nrow:hover { background: #f2f2f5; }

/* Install tip and update bar */
.install { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid rgb(167 139 250 / 35%); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }

@media (max-width: 520px) { .install { flex-wrap: wrap; } .install .row { margin-left: 0; } }
.updatebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; gap: 12px; align-items: center; background: var(--white); color: #000; border-radius: 999px; padding: 8px 8px 8px 18px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.updatebar .btn { background: #000; color: #fff; border-color: #000; }
