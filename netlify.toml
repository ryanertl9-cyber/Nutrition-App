# Netlify: static site, no build step. Deploys on every push to main.
[build]
  publish = "."
  command = ""
  # Skip the deploy (and its credits) when nothing the site serves has changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)tests' ':(exclude)docs' ':(exclude)scripts' ':(exclude)supabase' ':(exclude)vendor' ':(exclude)README.md' ':(exclude)package.json' ':(exclude).gitignore'"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://srvhbqhuabepnisdvveg.supabase.co wss://srvhbqhuabepnisdvveg.supabase.co https://api.nal.usda.gov https://world.openfoodfacts.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# The service worker must always be re-checked, or phones could stay on an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Send the old Netlify address to the real domain.
[[redirects]]
  from = "https://simplynutrition.netlify.app/*"
  to = "https://simplynutrition.app/:splat"
  status = 301
  force = true

# Keep repository internals off the public site.
[[redirects]]
  from = "/vendor/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
