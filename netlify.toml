# Netlify: static site, no build step. Deploys on every push to main.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://srvhbqhuabepnisdvveg.supabase.co wss://srvhbqhuabepnisdvveg.supabase.co https://api.nal.usda.gov; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Keep repository internals off the public site.
[[redirects]]
  from = "/vendor/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
